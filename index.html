<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forma — Impressão 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:   #1a1714; --ink2:  #3d3830; --stone: #8a8278;
  --fog:   #c8c2b8; --mist:  #ede9e3; --cream: #f7f4ef;
  --paper: #fdfcfa; --white: #ffffff;
  --ember: #c96a3a; --ember2:#e8845a; --wa: #25d366;
  --r: 12px; --r2: 20px;
  --ff-serif: 'Playfair Display', Georgia, serif;
  --ff-sans:  'Outfit', system-ui, sans-serif;
  --shadow: 0 2px 16px rgba(26,23,20,.08);
  --shadow-lg: 0 8px 40px rgba(26,23,20,.13);
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--ff-sans); background: var(--cream); color: var(--ink);
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
header {
  background: var(--paper); border-bottom: 1px solid var(--mist);
  position: sticky; top: 0; z-index: 200;
}
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
  height: 64px; display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: var(--ff-serif); font-size: 1.5rem; font-weight: 600;
  color: var(--ink); letter-spacing: -.5px;
}
.logo em { font-style: italic; color: var(--ember); }
.header-nav { display: flex; align-items: center; gap: 8px; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--ff-sans); font-size: .8rem; font-weight: 500;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 9px 18px; border-radius: 100px; border: none;
  cursor: pointer; transition: all .18s ease; text-decoration: none; white-space: nowrap;
}
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-dark:hover { background: var(--ink2); }
.btn-wa { background: var(--wa); color: #fff; }
.btn-wa:hover { filter: brightness(1.08); }
.btn-sm { padding: 7px 14px; font-size: .75rem; }

/* ─── HERO ─── */
.hero {
  max-width: 1200px; margin: 0 auto;
  padding: 80px 32px 64px; text-align: center;
}
.hero-eyebrow {
  font-size: .75rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ember); margin-bottom: 20px;
}
.hero h1 {
  font-family: var(--ff-serif);
  font-size: clamp(2.4rem, 4.5vw, 3.6rem);
  line-height: 1.1; letter-spacing: -.5px; margin-bottom: 20px; color: var(--ink);
}
.hero h1 em { font-style: italic; color: var(--ember); }
.hero-sub { font-size: 1rem; color: var(--stone); line-height: 1.7; max-width: 600px; margin: 0 auto 32px; }

/* ─── SECTION ─── */
.section { max-width: 1200px; margin: 0 auto; padding: 0 32px 80px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 32px; gap: 16px; flex-wrap: wrap;
}
.section-title {
  font-family: var(--ff-serif); font-size: 1.8rem; font-weight: 600; letter-spacing: -.3px;
}

/* ─── FILTERS ─── */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 32px; }
.filter {
  padding: 7px 16px; border-radius: 100px; border: 1px solid var(--fog);
  background: transparent; font-family: var(--ff-sans); font-size: .8rem;
  font-weight: 500; color: var(--stone); cursor: pointer; transition: all .15s;
}
.filter:hover, .filter.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ─── GRID ─── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }

/* ─── CARD ─── */
.card {
  background: var(--paper); border-radius: var(--r2); border: 1px solid var(--mist);
  overflow: hidden; transition: box-shadow .22s, transform .22s; cursor: default;
  display: flex; flex-direction: column;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.card.oos { opacity: .6; }

.card-img {
  aspect-ratio: 1 / 1; background: var(--mist);
  position: relative; overflow: hidden; width: 100%;
}
.card-img img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0; opacity: 0; transition: opacity .35s;
}
.card-img img.on { opacity: 1; }

model-viewer {
  width: 100%; height: 100%;
  background-color: var(--mist);
  --poster-color: transparent;
}

.card-img-empty {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 8px;
  color: var(--fog); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase;
}
.card-img-empty svg { opacity: .35; }

.card-badges {
  position: absolute; top: 12px; left: 12px;
  display: flex; gap: 5px; flex-wrap: wrap; z-index: 10;
}
.badge {
  padding: 4px 10px; border-radius: 100px; font-size: .68rem;
  font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  backdrop-filter: blur(4px);
}
.badge-oos { background: rgba(26,23,20,.85); color: var(--paper); }
.badge-key { background: rgba(201,106,58,.85); color: #fff; }
.badge-3d  { background: rgba(37,211,102,.85); color: #fff; }

.card-dots {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px; z-index: 10;
}
.card-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,.55); transition: width .2s, background .2s; cursor: pointer;
}
.card-dot.on { background: #fff; width: 14px; border-radius: 3px; }

.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
.card-name {
  font-family: var(--ff-serif); font-size: 1rem; font-weight: 600;
  margin-bottom: 10px; line-height: 1.3;
}
.card-size-sel {
  width: 100%; font-family: var(--ff-sans); font-size: .82rem; color: var(--ink);
  background: var(--cream); border: 1px solid var(--mist);
  padding: 8px 10px; border-radius: 8px; margin-bottom: 12px;
  outline: none; cursor: pointer; transition: border-color .15s;
}
.card-size-sel:focus { border-color: var(--fog); }

.card-bottom {
  display: flex; align-items: center; justify-content: space-between; margin-top: auto;
}
.card-price {
  font-family: var(--ff-serif); font-size: 1.3rem; font-weight: 600;
  color: var(--ink); letter-spacing: -.3px;
}
.card-price small { font-family: var(--ff-sans); font-size: .7rem; font-weight: 400; color: var(--stone); margin-right: 2px; }

.card-colors { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
.cdot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.8);
  box-shadow: 0 0 0 1px rgba(0,0,0,.1);
  transition: transform .15s;
}
.cdot:hover { transform: scale(1.2); }
.part-label {
  font-size: .7rem; color: var(--stone); margin-top: 6px; margin-bottom: 3px;
  text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
}

/* ─── EMPTY ─── */
.empty { grid-column: 1/-1; padding: 80px 20px; text-align: center; color: var(--stone); }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .4; }
.empty h3 { font-family: var(--ff-serif); font-size: 1.3rem; color: var(--ink2); margin-bottom: 6px; }

/* ─── FOOTER ─── */
footer { border-top: 1px solid var(--mist); background: var(--paper); }
.footer-inner {
  max-width: 1200px; margin: 0 auto; padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px; font-size: .8rem; color: var(--stone);
}
.footer-inner .logo { font-size: 1.1rem; }

/* ─── TOASTS ─── */
.toasts { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.t {
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px;
  font-size: .82rem; font-weight: 500; display: flex; align-items: center; gap: 8px;
  animation: tslide .25s ease; box-shadow: var(--shadow-lg); max-width: 300px;
}
@keyframes tslide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .header-inner, .footer-inner { padding: 0 20px; }
  .section { padding: 0 20px 60px; }
  .hero { padding: 40px 20px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Nossa lojinha <em>3D</em></div>
    <nav class="header-nav">
      <button class="btn btn-wa btn-sm" onclick="goWaTop()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
          <path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.554 4.118 1.528 5.851L.057 23.999l6.304-1.649C8.07 23.447 10.002 24 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.651-.52-5.157-1.428l-.369-.221-3.743.979.999-3.648-.242-.374C2.52 15.677 2 13.893 2 12 2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>
        </svg>
        Contato
      </button>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="hero-eyebrow">Impressão 3D</div>
  <h1>Ideias que nascem<br><em>camada por camada</em></h1>
  <p class="hero-sub">Peças únicas, chaveiros e decorações. Escolha o produto, a cor e fale diretamente conosco pelo WhatsApp.</p>
</div>

<div class="section">
  <div class="section-head">
    <div class="section-title">Catálogo</div>
    <div id="prodCount" style="font-size:.82rem;color:var(--stone)"></div>
  </div>
  <div class="filters" id="filterBar">
    <button class="filter on" onclick="setFilter('all',this)">Todos</button>
    <button class="filter" onclick="setFilter('chaveiro',this)">Chaveiros</button>
    <button class="filter" onclick="setFilter('objeto',this)">Objetos</button>
    <button class="filter" onclick="setFilter('avail',this)">Disponíveis</button>
  </div>
  <div class="grid" id="shopGrid"></div>
</div>

<footer>
  <div class="footer-inner">
    <div class="logo">Nossa lojinha <em>3D</em></div>
    <div>Impressão 3D personalizada</div>
    <button class="btn btn-dark btn-sm" onclick="goWaTop()">Falar no WhatsApp</button>
  </div>
</footer>

<div class="toasts" id="toasts"></div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURAÇÃO MANUAL — edite aqui tudo que precisar
══════════════════════════════════════════════════════════ */
const DEF = {

  /* ── Número do WhatsApp (DDI + DDD + número, só dígitos) ── */
  waNumber: '5553999387571',

  /* ══════════════════════════════════════════════════════
     CORES — aparecem em todos os produtos como bolinhas clicáveis.
  ══════════════════════════════════════════════════════ */
  colors: [
    { id: 'c2', name: 'Branco',   hex: '#f5f0e8' },
    { id: 'c3', name: 'Vermelho', hex: '#c0392b' },
    { id: 'c4', name: 'Azul',     hex: '#2980b9' },
    { id: 'c6', name: 'Amarelo',  hex: '#f1c40f' },
    { id: 'c8', name: 'Marrom',   hex: '#895129' },
    { id: 'c9', name: 'Cinza',    hex: '#7f8c8d' },
  ],

  /* ══════════════════════════════════════════════════════
     PRODUTOS

     NOVIDADE: campo "glbParts"
     ─────────────────────────────────────────────────────
     Use quando tiver 1 único arquivo .glb com múltiplos
     materiais/meshes que devem ter cores independentes.

     glbParts: {
       src: './assets/coracao_letra.glb',   ← arquivo único
       parts: [
         { label: 'Corpo',  materialIndex: 0 },
         { label: 'Letra',  materialIndex: 1 },
         // Adicione mais se tiver mais materiais
       ]
     }

     materialIndex → índice do material no GLB (0 = primeiro,
     1 = segundo, etc.). No Blender, a ordem dos materiais
     na lista "Material Properties" define o índice.

     ─────────────────────────────────────────────────────
     OUTRAS OPÇÕES (continuam funcionando):
       glb: ['arquivo.glb']            → 1 GLB, 1 cor global
       glb: ['parte1.glb','parte2.glb'] → 2 GLBs separados
     ─────────────────────────────────────────────────────
  ══════════════════════════════════════════════════════ */
  products: [

    /* ─── Exemplo: 1 GLB com 2 materiais (NOVO!) ─── */
    {
      id: 'prod_chaveiro_letra',
      name: 'Chaveiro coração com letra',
      type: 'chaveiro',
      desc: 'Corpo e letra com cores independentes — exportado como 1 único GLB.',
      imgs: [],
      glbParts: {
        src: './assets/coracao_letra.glb',
        parts: [
          { label: 'Corpo',  materialIndex: 0 },
          { label: 'Letra',  materialIndex: 1 },
        ]
      },
      sizes: [ { label: 'Único', price: 18.00 } ],
      oos: false
    },

    /* ─── Exemplo: Kit com 2 GLBs separados (como antes) ─── */
    {
      id: 'prod_chaveiro_01',
      name: 'Chaveiro coração pixel art',
      type: 'chaveiro',
      desc: 'Objeto impresso em duas partes encaixáveis.',
      imgs: [],
      glb:  [ './assets/coracaopixelarteparteum.glb', './assets/coracaopixelartepartedois.glb' ],
      sizes: [ { label: 'Único', price: 16.00 } ],
      oos: false
    },

    /* ─── 1 GLB, 1 cor global ─── */
    {
      id: 'prod_chaveiro_02',
      name: 'Chaveiro coração pixel art inteiro',
      type: 'chaveiro',
      desc: '',
      imgs: [],
      glb:  [ './assets/coracaopixelarteinteiro.glb' ],
      sizes: [ { label: 'Único', price: 16.00 } ],
      oos: false
    },

    {
      id: 'prod_chaveiro_03',
      name: 'Chaveiro coração',
      type: 'chaveiro',
      desc: 'Adicione as iniciais no chaveiro',
      imgs: [],
      glb:  [ './assets/coracao.glb' ],
      sizes: [ { label: 'Único', price: 16.00 } ],
      oos: false
    },

    {
      id: 'prod_chaveiro_04',
      name: 'Chaveiro coração pixel art',
      type: 'chaveiro',
      desc: 'Adicione as iniciais no chaveiro',
      imgs: [],
      glb:  [ './assets/coracaopixelart.glb' ],
      sizes: [ { label: 'Único', price: 16.00 } ],
      oos: false
    },

  ]
};
/* ══════════════════════════════════════════════════════════
   LÓGICA — não mexa abaixo daqui
══════════════════════════════════════════════════════════ */

let curFilter = 'all';

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderShop();
}

function renderShop() {
  let prods = [...DEF.products];
  if (curFilter === 'chaveiro') prods = prods.filter(p => p.type === 'chaveiro');
  if (curFilter === 'objeto')   prods = prods.filter(p => p.type === 'objeto');
  if (curFilter === 'avail')    prods = prods.filter(p => !p.oos);

  const total = prods.length;
  const avail = prods.filter(p => !p.oos).length;
  document.getElementById('prodCount').textContent =
    `${total} produto${total !== 1 ? 's' : ''} · ${avail} disponíve${avail !== 1 ? 'is' : 'l'}`;

  const grid = document.getElementById('shopGrid');
  if (!grid) return;

  if (!prods.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">◎</div><h3>Nenhum produto</h3><p>Tente outro filtro.</p></div>';
    return;
  }

  grid.innerHTML = prods.map((p, i) => {
    try { return cardHTML(p, i); }
    catch(e) { console.error('card error:', e); return ''; }
  }).join('');

  grid.querySelectorAll('.card-img[data-imgs]').forEach(c => { try { initCarousel(c); } catch(e) {} });
}

function cardHTML(p, i) {
  let imgs    = Array.isArray(p.imgs) ? p.imgs.filter(Boolean) : [];
  let glbs    = Array.isArray(p.glb)  ? p.glb.filter(Boolean)  : [];
  let glbParts = p.glbParts || null;   // { src, parts: [{label, materialIndex}] }

  const oosTag = p.oos ? '<span class="badge badge-oos">Esgotado</span>' : '';
  let imgSection = '';
  let colorSections = '';
  const safeColors = Array.isArray(DEF.colors) ? DEF.colors : [];

  /* ════════════════════════════════════════════════════
     MODO A: 1 GLB com múltiplos materiais (glbParts)
     ════════════════════════════════════════════════════ */
  if (glbParts && glbParts.src) {
    const partCount = (glbParts.parts || []).length;
    const badgeLabel = partCount > 1
      ? `<span class="badge badge-3d">${partCount} materiais</span>`
      : '<span class="badge badge-3d">Interativo 3D</span>';

    imgSection = `<div class="card-img">
      <model-viewer id="mv-${p.id}"
        src="${esc(glbParts.src)}"
        auto-rotate camera-controls shadow-intensity="1"
        style="width:100%;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>
      <div class="card-badges">${oosTag || badgeLabel}</div>
    </div>`;

    /* Um seletor de cor por material */
    if (partCount > 0) {
      (glbParts.parts || []).forEach((part, matIdx) => {
        const dots = safeColors.map(c =>
          `<div class="cdot" style="background:${c.hex};cursor:pointer" title="${esc(c.name)}"
            onclick="applyMaterialColor('${p.id}',${part.materialIndex},'${c.hex}')"></div>`
        ).join('');
        colorSections += `<div class="part-label">Cor — ${esc(part.label)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${dots}</div>`;
      });
    } else {
      /* glbParts sem parts definidas → tratar como 1 cor global */
      const dots = safeColors.map(c =>
        `<div class="cdot" style="background:${c.hex};cursor:pointer" title="${esc(c.name)}"
          onclick="changeModelColor('${p.id}','${c.hex}')"></div>`
      ).join('');
      colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots}</div>`;
    }

  /* ════════════════════════════════════════════════════
     MODO B: 2+ GLBs separados
     ════════════════════════════════════════════════════ */
  } else if (glbs.length > 1) {
    const viewers = glbs.map((url, idx) =>
      `<model-viewer
        id="mv-${p.id}-${idx}"
        src="${esc(url)}"
        auto-rotate camera-controls shadow-intensity="1"
        style="flex:1;min-width:0;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>`
    ).join('');
    imgSection = `<div class="card-img" style="display:flex;gap:3px;overflow:hidden">
      ${viewers}
      <div class="card-badges">${oosTag || `<span class="badge badge-3d">Kit 3D (${glbs.length} partes)</span>`}</div>
    </div>`;

    for (let k = 0; k < glbs.length; k++) {
      const dots = safeColors.map(c =>
        `<div class="cdot" style="background:${c.hex};cursor:pointer" title="${esc(c.name)}"
          onclick="changePartColor('${p.id}',${k},'${c.hex}')"></div>`
      ).join('');
      colorSections += `<div class="part-label">Cor — Parte ${k+1}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${dots}</div>`;
    }

  /* ════════════════════════════════════════════════════
     MODO C: 1 GLB, 1 cor global
     ════════════════════════════════════════════════════ */
  } else if (glbs.length === 1) {
    imgSection = `<div class="card-img">
      <model-viewer id="mv-${p.id}"
        src="${esc(glbs[0])}"
        auto-rotate camera-controls shadow-intensity="1"
        style="width:100%;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>
      <div class="card-badges">${oosTag || '<span class="badge badge-3d">Interativo 3D</span>'}</div>
    </div>`;

    const dots = safeColors.map(c =>
      `<div class="cdot" style="background:${c.hex};cursor:pointer" title="${esc(c.name)}"
        onclick="changeModelColor('${p.id}','${c.hex}')"></div>`
    ).join('');
    colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots}</div>`;

  /* ════════════════════════════════════════════════════
     MODO D: apenas fotos (carousel)
     ════════════════════════════════════════════════════ */
  } else if (imgs.length > 0) {
    const dots = imgs.length > 1
      ? `<div class="card-dots">${imgs.map((_,j) => `<div class="card-dot${j===0?' on':''}" onclick="carouselTo(this,${j})"></div>`).join('')}</div>`
      : '';
    imgSection = `<div class="card-img" data-imgs='${JSON.stringify(imgs)}'>
      ${imgs.map((u, j) => `<img src="${u}" alt="${esc(p.name)}" class="${j===0?'on':''}" loading="lazy">`).join('')}
      <div class="card-badges">${oosTag}${!p.oos && p.type==='chaveiro' ? '<span class="badge badge-key">Chaveiro</span>' : ''}</div>
      ${dots}
    </div>`;

    const dots2 = safeColors.map(c =>
      `<div class="cdot" style="background:${c.hex};cursor:pointer" title="${esc(c.name)}"></div>`
    ).join('');
    colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots2}</div>`;

  /* ════════════════════════════════════════════════════
     MODO E: sem imagem
     ════════════════════════════════════════════════════ */
  } else {
    imgSection = `<div class="card-img">
      <div class="card-img-empty">
        <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Sem Imagem</span>
      </div>
      ${p.oos ? '<div class="card-badges"><span class="badge badge-oos">Esgotado</span></div>' : ''}
    </div>`;
    colorSections = '';
  }

  /* ─── Tamanho / preço ─── */
  const hasSizes = Array.isArray(p.sizes) && p.sizes.length > 0;
  const sizeRow = (hasSizes && p.sizes.length > 1)
    ? `<select class="card-size-sel" id="sel${p.id}" onchange="updPrice('${p.id}')">
        ${p.sizes.map((s,j) => `<option value="${j}" data-price="${s.price||0}">${esc(s.label||'Opção')} — R$ ${fmt(s.price||0)}</option>`).join('')}
       </select>`
    : `<div style="font-size:.75rem;color:var(--stone);margin-bottom:10px;letter-spacing:.02em">${esc(hasSizes ? (p.sizes[0]?.label||'Único') : 'Único')}</div>`;

  const defaultPrice = hasSizes ? (p.sizes[0]?.price || 0) : 0;

  return `<div class="card${p.oos?' oos':''}" style="animation:fade .3s ${i*.04}s both">
    ${imgSection}
    <div class="card-body">
      <div class="card-name">${esc(p.name)}</div>
      ${sizeRow}
      ${colorSections}
      <div class="card-bottom">
        <div class="card-price" id="pr${p.id}"><small>R$</small>${fmt(defaultPrice)}</div>
        ${p.oos
          ? '<span style="font-size:.75rem;color:var(--stone);font-weight:500">Indisponível</span>'
          : `<button onclick="makeOrder('${p.id}','${esc(p.name)}')" class="btn btn-dark btn-sm">Pedir</button>`}
      </div>
    </div>
  </div>`;
}

/* ── Pedido via WhatsApp ── */
function makeOrder(productId, productName) {
  const sel = document.getElementById('sel' + productId);
  let valor = 0, varName = '';
  if (sel) {
    const opt = sel.options[sel.selectedIndex];
    valor = parseFloat(opt.getAttribute('data-price')) || 0;
    varName = ` (Tamanho: ${opt.text.split(' — ')[0]})`;
  } else {
    const p = DEF.products.find(x => x.id === productId);
    if (p && p.sizes && p.sizes[0]) valor = p.sizes[0].price || 0;
  }
  const msg = `Olá! Quero pedir o item: ${productName}${varName} - Valor: R$ ${fmt(valor)}.`;
  window.open(`https://wa.me/${DEF.waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
}

function updPrice(id) {
  const p = DEF.products.find(x => x.id === id);
  const sel = document.getElementById('sel' + id);
  if (!p || !sel) return;
  document.getElementById('pr' + id).innerHTML = `<small>R$</small>${fmt(p.sizes[+sel.value]?.price || 0)}`;
}

/* ── Carousel ── */
function initCarousel(el) {
  const imgs = el.querySelectorAll('img');
  if (imgs.length < 2) return;
  let cur = 0;
  const dots = el.querySelectorAll('.card-dot');
  setInterval(() => {
    imgs[cur].classList.remove('on'); dots[cur]?.classList.remove('on');
    cur = (cur + 1) % imgs.length;
    imgs[cur].classList.add('on'); dots[cur]?.classList.add('on');
  }, 3200);
}

function carouselTo(dot, idx) {
  const c = dot.closest('.card-img');
  c.querySelectorAll('img').forEach((img, i) => img.classList.toggle('on', i === idx));
  c.querySelectorAll('.card-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
}

/* ── WhatsApp ── */
function goWaTop() {
  const texto = encodeURIComponent('Olá! Visitei a loja Forma 3D e gostaria de informações.');
  window.open(`https://wa.me/${DEF.waNumber}?text=${texto}`, '_blank');
}

/* ══════════════════════════════════════════════════════════
   FUNÇÕES DE COR EM MODELOS 3D
══════════════════════════════════════════════════════════ */

/** Aplica cor a UM material específico pelo índice */
function applyMaterialColor(prodId, materialIndex, hex) {
  const mv = document.getElementById('mv-' + prodId);
  if (!mv) return;
  const [r, g, b] = hexToRgb(hex);
  const apply = () => {
    const mats = mv.model && mv.model.materials;
    if (!mats) return;
    if (mats[materialIndex]) {
      mats[materialIndex].pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
    }
  };
  if (mv.model) apply();
  else mv.addEventListener('load', apply, { once: true });
}

/** Aplica cor a TODOS os materiais do modelo (1 GLB, 1 cor) */
function changeModelColor(prodId, hex) {
  const mv = document.getElementById('mv-' + prodId);
  if (!mv) return;
  const [r, g, b] = hexToRgb(hex);
  const apply = () => {
    if (mv.model && mv.model.materials) {
      mv.model.materials.forEach(mat => {
        mat.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
      });
    }
  };
  if (mv.model) apply();
  else mv.addEventListener('load', apply, { once: true });
}

/** Aplica cor ao modelo de uma parte (kit de GLBs separados) */
function changePartColor(prodId, partIdx, hex) {
  const mv = document.getElementById('mv-' + prodId + '-' + partIdx);
  if (mv) changeModelColor(prodId + '-' + partIdx, hex);
}

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3), 16) / 255,
    parseInt(hex.slice(3,5), 16) / 255,
    parseInt(hex.slice(5,7), 16) / 255,
  ];
}

/* ─── Utilitários ─── */
function fmt(n) { return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ─── Boot ─── */
renderShop();
</script>
