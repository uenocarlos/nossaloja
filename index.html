<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forma — Impressão 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:   #1a1714; --ink2:  #3d3830; --stone: #8a8278;
  --fog:   #c8c2b8; --mist:  #ede9e3; --cream: #f7f4ef;
  --paper: #fdfcfa; --white: #ffffff;
  --ember: #c96a3a; --ember2:#e8845a; --wa: #25d366;
  --r: 12px; --r2: 20px;
  --ff-serif: 'Playfair Display', Georgia, serif;
  --ff-sans:  'Outfit', system-ui, sans-serif;
  --shadow: 0 2px 16px rgba(26,23,20,.08);
  --shadow-lg: 0 8px 40px rgba(26,23,20,.13);
  --cart-w: 380px;
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--ff-sans); background: var(--cream); color: var(--ink);
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ─── HEADER ─── */
header {
  background: var(--paper); border-bottom: 1px solid var(--mist);
  position: sticky; top: 0; z-index: 200;
}
.header-inner {
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
  height: 64px; display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: var(--ff-serif); font-size: 1.5rem; font-weight: 600;
  color: var(--ink); letter-spacing: -.5px;
}
.logo em { font-style: italic; color: var(--ember); }
.header-nav { display: flex; align-items: center; gap: 8px; }

/* ─── BUTTONS ─── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--ff-sans); font-size: .8rem; font-weight: 500;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 9px 18px; border-radius: 100px; border: none;
  cursor: pointer; transition: all .18s ease; text-decoration: none; white-space: nowrap;
}
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-dark:hover { background: var(--ink2); }
.btn-wa { background: var(--wa); color: #fff; }
.btn-wa:hover { filter: brightness(1.08); }
.btn-sm { padding: 7px 14px; font-size: .75rem; }
.btn-ember { background: var(--ember); color: #fff; }
.btn-ember:hover { background: var(--ember2); }

/* ─── HERO ─── */
.hero {
  max-width: 1200px; margin: 0 auto;
  padding: 80px 32px 64px; text-align: center;
}
.hero-eyebrow {
  font-size: .75rem; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ember); margin-bottom: 20px;
}
.hero h1 {
  font-family: var(--ff-serif);
  font-size: clamp(2.4rem, 4.5vw, 3.6rem);
  line-height: 1.1; letter-spacing: -.5px; margin-bottom: 20px; color: var(--ink);
}
.hero h1 em { font-style: italic; color: var(--ember); }
.hero-sub { font-size: 1rem; color: var(--stone); line-height: 1.7; max-width: 600px; margin: 0 auto 32px; }

/* ─── SECTION ─── */
.section { max-width: 1200px; margin: 0 auto; padding: 0 32px 80px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 32px; gap: 16px; flex-wrap: wrap;
}
.section-title {
  font-family: var(--ff-serif); font-size: 1.8rem; font-weight: 600; letter-spacing: -.3px;
}

/* ─── FILTERS ─── */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 32px; }
.filter {
  padding: 7px 16px; border-radius: 100px; border: 1px solid var(--fog);
  background: transparent; font-family: var(--ff-sans); font-size: .8rem;
  font-weight: 500; color: var(--stone); cursor: pointer; transition: all .15s;
}
.filter:hover, .filter.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ─── GRID ─── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

/* ─── CARD ─── */
.card {
  background: var(--paper); border-radius: var(--r2); border: 1px solid var(--mist);
  overflow: hidden; transition: box-shadow .22s, transform .22s; cursor: default;
  display: flex; flex-direction: column;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }
.card.oos { opacity: .6; }

.card-img {
  aspect-ratio: 1 / 1; background: var(--mist);
  position: relative; overflow: hidden; width: 100%;
}
.card-img img {
  width: 100%; height: 100%; object-fit: cover;
  position: absolute; inset: 0; opacity: 0; transition: opacity .35s;
}
.card-img img.on { opacity: 1; }

model-viewer {
  width: 100%; height: 100%;
  background-color: var(--mist);
  --poster-color: transparent;
}

.card-img-empty {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; flex-direction: column; gap: 8px;
  color: var(--fog); font-size: .8rem; letter-spacing: .05em; text-transform: uppercase;
}
.card-img-empty svg { opacity: .35; }

.card-badges {
  position: absolute; top: 12px; left: 12px;
  display: flex; gap: 5px; flex-wrap: wrap; z-index: 10;
}
.badge {
  padding: 4px 10px; border-radius: 100px; font-size: .68rem;
  font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  backdrop-filter: blur(4px);
}
.badge-oos { background: rgba(26,23,20,.85); color: var(--paper); }
.badge-key { background: rgba(201,106,58,.85); color: #fff; }
.badge-3d  { background: rgba(37,211,102,.85); color: #fff; }

.card-dots {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px; z-index: 10;
}
.card-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,.55); transition: width .2s, background .2s; cursor: pointer;
}
.card-dot.on { background: #fff; width: 14px; border-radius: 3px; }

.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
.card-name {
  font-family: var(--ff-serif); font-size: 1rem; font-weight: 600;
  margin-bottom: 10px; line-height: 1.3;
}
.card-size-sel {
  width: 100%; font-family: var(--ff-sans); font-size: .82rem; color: var(--ink);
  background: var(--cream); border: 1px solid var(--mist);
  padding: 8px 10px; border-radius: 8px; margin-bottom: 12px;
  outline: none; cursor: pointer; transition: border-color .15s;
}
.card-size-sel:focus { border-color: var(--fog); }

.card-bottom {
  display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 10px;
}
.card-price {
  font-family: var(--ff-serif); font-size: 1.3rem; font-weight: 600;
  color: var(--ink); letter-spacing: -.3px;
}
.card-price small { font-family: var(--ff-sans); font-size: .7rem; font-weight: 400; color: var(--stone); margin-right: 2px; }

/* ─── QTY STEPPER ─── */
.qty-stepper {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--mist); border-radius: 100px;
  overflow: hidden; background: var(--cream);
}
.qty-btn {
  width: 30px; height: 30px; border: none; background: transparent;
  font-size: 1.1rem; font-weight: 500; color: var(--ink2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .14s; flex-shrink: 0;
}
.qty-btn:hover { background: var(--mist); }
.qty-num {
  min-width: 26px; text-align: center; font-size: .85rem;
  font-weight: 600; color: var(--ink); user-select: none;
}

.card-colors { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
.cdot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.8);
  box-shadow: 0 0 0 1px rgba(0,0,0,.1);
  transition: transform .15s, box-shadow .15s;
  cursor: pointer;
}
.cdot:hover { transform: scale(1.2); }
.cdot.selected {
  box-shadow: 0 0 0 2px var(--ink);
  transform: scale(1.15);
}
.part-label {
  font-size: .7rem; color: var(--stone); margin-top: 6px; margin-bottom: 3px;
  text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
}

/* ─── ADD TO CART ROW ─── */
.card-actions {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--mist);
}
.card-price-wrap { display: flex; flex-direction: column; }
.card-price-label { font-size: .68rem; color: var(--stone); text-transform: uppercase; letter-spacing: .05em; }

/* ─── EMPTY ─── */
.empty { grid-column: 1/-1; padding: 80px 20px; text-align: center; color: var(--stone); }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .4; }
.empty h3 { font-family: var(--ff-serif); font-size: 1.3rem; color: var(--ink2); margin-bottom: 6px; }

/* ─── FOOTER ─── */
footer { border-top: 1px solid var(--mist); background: var(--paper); }
.footer-inner {
  max-width: 1200px; margin: 0 auto; padding: 28px 32px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 16px; font-size: .8rem; color: var(--stone);
}
.footer-inner .logo { font-size: 1.1rem; }

/* ─── TOASTS ─── */
.toasts { position: fixed; bottom: 24px; left: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.t {
  background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 12px;
  font-size: .82rem; font-weight: 500; display: flex; align-items: center; gap: 8px;
  animation: tslide .25s ease; box-shadow: var(--shadow-lg); max-width: 300px;
}
@keyframes tslide { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ═══════════════════════════════════════════════
   CARRINHO FLUTUANTE
═══════════════════════════════════════════════ */

/* Botão flutuante */
.cart-fab {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  z-index: 300;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 16px 0 0 16px;
  padding: 16px 14px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  box-shadow: -4px 0 24px rgba(26,23,20,.18);
  transition: background .18s, transform .18s;
}
.cart-fab:hover { background: var(--ink2); transform: translateY(-50%) translateX(-2px); }
.cart-fab svg { display: block; }
.cart-fab-label {
  font-size: .6rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; writing-mode: vertical-rl;
  text-orientation: mixed; transform: rotate(180deg);
  line-height: 1;
}
.cart-badge {
  position: absolute;
  top: 8px; right: 10px;
  background: var(--ember);
  color: #fff;
  font-size: .62rem; font-weight: 700;
  min-width: 18px; height: 18px;
  border-radius: 100px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  opacity: 0; transform: scale(.5);
  transition: opacity .2s, transform .2s;
}
.cart-badge.show { opacity: 1; transform: scale(1); }

/* Overlay */
.cart-overlay {
  position: fixed; inset: 0; background: rgba(26,23,20,.35);
  z-index: 400; opacity: 0; pointer-events: none;
  transition: opacity .3s;
  backdrop-filter: blur(2px);
}
.cart-overlay.open { opacity: 1; pointer-events: all; }

/* Sidebar */
.cart-sidebar {
  position: fixed; top: 0; right: 0; height: 100vh;
  width: var(--cart-w); max-width: 100vw;
  background: var(--paper);
  z-index: 500;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow: -8px 0 48px rgba(26,23,20,.15);
}
.cart-sidebar.open { transform: translateX(0); }

.cart-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--mist);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.cart-title {
  font-family: var(--ff-serif); font-size: 1.3rem; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
.cart-close {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: var(--mist); color: var(--ink2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; transition: background .15s;
}
.cart-close:hover { background: var(--fog); }

.cart-body {
  flex: 1; overflow-y: auto; padding: 16px 24px;
}

/* Item no carrinho */
.cart-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid var(--mist);
  animation: fade .2s ease;
}
.cart-item:last-child { border-bottom: none; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name {
  font-family: var(--ff-serif); font-size: .92rem; font-weight: 600;
  line-height: 1.3; margin-bottom: 4px;
}
.cart-item-meta {
  font-size: .75rem; color: var(--stone); line-height: 1.5;
}
.cart-item-meta span {
  display: inline-flex; align-items: center; gap: 4px;
}
.cart-color-swatch {
  display: inline-block;
  width: 10px; height: 10px; border-radius: 50%;
  border: 1px solid rgba(0,0,0,.15);
  vertical-align: middle;
}
.cart-item-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0;
}
.cart-item-price {
  font-family: var(--ff-serif); font-size: 1rem; font-weight: 600; white-space: nowrap;
}
.cart-item-remove {
  background: none; border: none; color: var(--fog); cursor: pointer;
  font-size: .75rem; padding: 0; transition: color .15s;
  display: flex; align-items: center; gap: 3px;
}
.cart-item-remove:hover { color: #c0392b; }

/* Cart stepper (menor) */
.cart-qty {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--mist); border-radius: 100px;
  overflow: hidden; background: var(--cream);
}
.cart-qty-btn {
  width: 24px; height: 24px; border: none; background: transparent;
  font-size: 1rem; font-weight: 500; color: var(--ink2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .14s;
}
.cart-qty-btn:hover { background: var(--mist); }
.cart-qty-num {
  min-width: 22px; text-align: center; font-size: .8rem;
  font-weight: 600; color: var(--ink); user-select: none;
}

/* Cart empty */
.cart-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 200px; color: var(--stone); gap: 10px;
}
.cart-empty svg { opacity: .25; }
.cart-empty p { font-size: .88rem; }

.cart-footer {
  padding: 16px 24px 24px;
  border-top: 1px solid var(--mist);
  flex-shrink: 0;
}
.cart-total-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 16px;
}
.cart-total-label { font-size: .78rem; color: var(--stone); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.cart-total-val { font-family: var(--ff-serif); font-size: 1.5rem; font-weight: 600; }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .header-inner, .footer-inner { padding: 0 20px; }
  .section { padding: 0 20px 60px; }
  .hero { padding: 40px 20px; }
  :root { --cart-w: 100vw; }
  .cart-fab { border-radius: 12px 0 0 12px; padding: 12px 10px; }
}
</style>
</head>
<body>

<!-- ─── HEADER ─── -->
<header>
  <div class="header-inner">
    <div class="logo">Nossa lojinha <em>3D</em></div>
    <nav class="header-nav">
      <button class="btn btn-wa btn-sm" onclick="goWaTop()">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24">

        </svg>
        Contato
      </button>
    </nav>
  </div>
</header>

<!-- ─── HERO ─── -->
<div class="hero">
  <h1>Ideias que nascem<br><em>camada por camada</em></h1>
  <p class="hero-sub">Escolha o produto, a cor e fale diretamente conosco pelo WhatsApp.</p>
</div>

<!-- ─── CATÁLOGO ─── -->
<div class="section">
  <div class="section-head">
    <div class="section-title">Catálogo</div>
    <div id="prodCount" style="font-size:.82rem;color:var(--stone)"></div>
  </div>
  <div class="filters" id="filterBar">
    <button class="filter on" onclick="setFilter('all',this)">Todos</button>
    <button class="filter" onclick="setFilter('chaveiro',this)">Chaveiros</button>
    <button class="filter" onclick="setFilter('objeto',this)">Objetos</button>
    <button class="filter" onclick="setFilter('avail',this)">Disponíveis</button>
  </div>
  <div class="grid" id="shopGrid"></div>
</div>

<footer>
  <div class="footer-inner">
    <div class="logo">Nossa lojinha <em>3D</em></div>
    <div>Impressão 3D personalizada</div>
    <button class="btn btn-dark btn-sm" onclick="goWaTop()">Falar no WhatsApp</button>
  </div>
</footer>

<!-- ─── CARRINHO FAB ─── -->
<button class="cart-fab" onclick="openCart()" aria-label="Abrir carrinho">
  <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
    <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
    <line x1="3" y1="6" x2="21" y2="6"/>
    <path d="M16 10a4 4 0 01-8 0"/>
  </svg>
  <span class="cart-fab-label">Carrinho</span>
  <span class="cart-badge" id="cartBadge">0</span>
</button>

<!-- ─── OVERLAY + SIDEBAR ─── -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<div class="cart-sidebar" id="cartSidebar">
  <div class="cart-header">
    <div class="cart-title">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Carrinho
    </div>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-val" id="cartTotal">R$ 0,00</span>
    </div>
    <button class="btn btn-wa" style="width:100%;justify-content:center;font-size:.88rem;padding:13px 18px" onclick="sendCartWA()">

/* ══════════════════════════════════════════════════════════
   ESTADO DO CARRINHO
   cart = [ { cartId, productId, name, sizeLabel, price, qty, colors: {partLabel: {name,hex}} } ]
══════════════════════════════════════════════════════════ */
let cart = [];
let cartOpen = false;

/* ── Estado de cor selecionada por produto ── */
/* selectedColors[prodId] = { 'partLabel' ou 'global': { name, hex } } */
const selectedColors = {};

function getSelectedColors(prodId) {
  return selectedColors[prodId] || {};
}

/* ── Carrinho: abrir / fechar ── */
function openCart() {
  cartOpen = true;
  document.getElementById('cartSidebar').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderCart();
}
function closeCart() {
  cartOpen = false;
  document.getElementById('cartSidebar').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── Adicionar ao carrinho ── */
function addToCart(productId) {
  const p = DEF.products.find(x => x.id === productId);
  if (!p || p.oos) return;

  const sel = document.getElementById('sel' + productId);
  let price = 0, sizeLabel = 'Único';
  if (sel) {
    const opt = sel.options[sel.selectedIndex];
    price = parseFloat(opt.getAttribute('data-price')) || 0;
    sizeLabel = opt.text.split(' — ')[0];
  } else if (p.sizes && p.sizes[0]) {
    price = p.sizes[0].price || 0;
    sizeLabel = p.sizes[0].label || 'Único';
  }

  const qtyEl = document.getElementById('qty-' + productId);
  const qty = qtyEl ? parseInt(qtyEl.dataset.qty) || 1 : 1;

  const colors = selectedColors[productId] || {};

  /* Gera ID único para este item (produto + tamanho + cores) */
  const colorKey = JSON.stringify(colors);
  const existing = cart.find(i => i.productId === productId && i.sizeLabel === sizeLabel && JSON.stringify(i.colors) === colorKey);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      cartId: Date.now() + Math.random(),
      productId, name: p.name, sizeLabel, price, qty,
      colors: JSON.parse(colorKey)
    });
  }

  updateCartBadge();
  if (cartOpen) renderCart();

  /* Reset qty para 1 */
  if (qtyEl) { qtyEl.dataset.qty = 1; qtyEl.textContent = 1; }

  toast('✓ Adicionado ao carrinho');
}

/* ── Remover item ── */
function removeCartItem(cartId) {
  cart = cart.filter(i => i.cartId !== cartId);
  updateCartBadge();
  renderCart();
}

/* ── Alterar qty no carrinho ── */
function changeCartQty(cartId, delta) {
  const item = cart.find(i => i.cartId === cartId);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCart();
  updateCartBadge();
}

/* ── Atualizar badge ── */
function updateCartBadge() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = total;
  badge.classList.toggle('show', total > 0);
}

/* ── Renderizar carrinho ── */
function renderCart() {
  const body = document.getElementById('cartBody');
  const totalEl = document.getElementById('cartTotal');
  if (!body) return;

  if (!cart.length) {
    body.innerHTML = `<div class="cart-empty">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <p>Seu carrinho está vazio</p>
    </div>`;
    totalEl.textContent = 'R$ 0,00';
    return;
  }

  let totalVal = 0;
  body.innerHTML = cart.map(item => {
    totalVal += item.price * item.qty;

    /* ─ montar linha de cores ─ */
    let colorLines = '';
    const colKeys = Object.keys(item.colors);
    if (colKeys.length > 0) {
      colKeys.forEach(part => {
        const c = item.colors[part];
        colorLines += `<span>
          <span class="cart-color-swatch" style="background:${c.hex}"></span>
          ${part !== 'global' ? part + ': ' : ''}${c.name}
        </span><br>`;
      });
    } else {
      colorLines = '<span style="font-style:italic">Cor não selecionada</span>';
    }

    return `<div class="cart-item" data-cid="${item.cartId}">
      <div class="cart-item-info">
        <div class="cart-item-name">${esc(item.name)}</div>
        <div class="cart-item-meta">
          <span>Tam.: ${esc(item.sizeLabel)}</span><br>
          ${colorLines}
        </div>
      </div>
      <div class="cart-item-right">
        <div class="cart-item-price">R$ ${fmt(item.price * item.qty)}</div>
        <div class="cart-qty">
          <button class="cart-qty-btn" onclick="changeCartQty(${item.cartId},-1)">−</button>
          <span class="cart-qty-num">${item.qty}</span>
          <button class="cart-qty-btn" onclick="changeCartQty(${item.cartId},1)">+</button>
        </div>
        <button class="cart-item-remove" onclick="removeCartItem(${item.cartId})">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
          Remover
        </button>
      </div>
    </div>`;
  }).join('');

  totalEl.textContent = 'R$ ' + fmt(totalVal);
}

/* ── Enviar pedido via WhatsApp ── */
function sendCartWA() {
  if (!cart.length) { toast('Carrinho vazio!'); return; }

  let lines = ['Olá! Gostaria de fazer um pedido:\n'];
  let total = 0;

  cart.forEach((item, idx) => {
    lines.push(`*${idx + 1}. ${item.name}*`);
    lines.push(`   Tamanho: ${item.sizeLabel}`);

    const colKeys = Object.keys(item.colors);
    if (colKeys.length > 0) {
      colKeys.forEach(part => {
        const c = item.colors[part];
        const partLabel = part !== 'global' ? part + ': ' : 'Cor: ';
        lines.push(`   ${partLabel}${c.name}`);
      });
    } else {
      lines.push(`   Cor: a combinar`);
    }

    lines.push(`   Qtd: ${item.qty} × R$ ${fmt(item.price)} = R$ ${fmt(item.price * item.qty)}`);
    lines.push('');
    total += item.price * item.qty;
  });

  lines.push(`*Total: R$ ${fmt(total)}*`);

  const msg = lines.join('\n');
  window.open(`https://wa.me/${DEF.waNumber}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ══════════════════════════════════════════════════════════
   LOJA
══════════════════════════════════════════════════════════ */
let curFilter = 'all';

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderShop();
}

function renderShop() {
  let prods = [...DEF.products];
  if (curFilter === 'chaveiro') prods = prods.filter(p => p.type === 'chaveiro');
  if (curFilter === 'objeto')   prods = prods.filter(p => p.type === 'objeto');
  if (curFilter === 'avail')    prods = prods.filter(p => !p.oos);

  const total = prods.length;
  const avail = prods.filter(p => !p.oos).length;
  document.getElementById('prodCount').textContent =
    `${total} produto${total !== 1 ? 's' : ''} · ${avail} disponíve${avail !== 1 ? 'is' : 'l'}`;

  const grid = document.getElementById('shopGrid');
  if (!grid) return;

  if (!prods.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">◎</div><h3>Nenhum produto</h3><p>Tente outro filtro.</p></div>';
    return;
  }

  grid.innerHTML = prods.map((p, i) => {
    try { return cardHTML(p, i); }
    catch(e) { console.error('card error:', e); return ''; }
  }).join('');

  grid.querySelectorAll('.card-img[data-imgs]').forEach(c => { try { initCarousel(c); } catch(e) {} });
}

function cardHTML(p, i) {
  let imgs    = Array.isArray(p.imgs) ? p.imgs.filter(Boolean) : [];
  let glbs    = Array.isArray(p.glb)  ? p.glb.filter(Boolean)  : [];
  let glbParts = p.glbParts || null;

  const oosTag = p.oos ? '<span class="badge badge-oos">Esgotado</span>' : '';
  let imgSection = '';
  let colorSections = '';
  const safeColors = Array.isArray(DEF.colors) ? DEF.colors : [];

  /* ─── MODO A: 1 GLB com múltiplos materiais ─── */
  if (glbParts && glbParts.src) {
    const partCount = (glbParts.parts || []).length;
    const badgeLabel = partCount > 1
      ? `<span class="badge badge-3d">${partCount} materiais</span>`
      : '<span class="badge badge-3d">Interativo 3D</span>';

    imgSection = `<div class="card-img">
      <model-viewer id="mv-${p.id}"
        src="${esc(glbParts.src)}"
        auto-rotate camera-controls shadow-intensity="1"
        style="width:100%;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>
      <div class="card-badges">${oosTag || badgeLabel}</div>
    </div>`;

    if (partCount > 0) {
      (glbParts.parts || []).forEach((part) => {
        const dots = safeColors.map(c =>
          `<div class="cdot" id="cdot-${p.id}-${part.label.replace(/\s/g,'_')}-${c.id}"
            style="background:${c.hex}" title="${esc(c.name)}"
            onclick="selectColor('${p.id}','${esc(part.label)}',${part.materialIndex},'${c.hex}','${esc(c.name)}',this,'mat')"></div>`
        ).join('');
        colorSections += `<div class="part-label">Cor — ${esc(part.label)}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${dots}</div>`;
      });
    } else {
      const dots = safeColors.map(c =>
        `<div class="cdot" id="cdot-${p.id}-global-${c.id}"
          style="background:${c.hex}" title="${esc(c.name)}"
          onclick="selectColor('${p.id}','global',-1,'${c.hex}','${esc(c.name)}',this,'all')"></div>`
      ).join('');
      colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots}</div>`;
    }

  /* ─── MODO B: 2+ GLBs separados ─── */
  } else if (glbs.length > 1) {
    const viewers = glbs.map((url, idx) =>
      `<model-viewer id="mv-${p.id}-${idx}" src="${esc(url)}"
        auto-rotate camera-controls shadow-intensity="1"
        style="flex:1;min-width:0;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>`
    ).join('');
    imgSection = `<div class="card-img" style="display:flex;gap:3px;overflow:hidden">
      ${viewers}
      <div class="card-badges">${oosTag || `<span class="badge badge-3d">Kit 3D (${glbs.length} partes)</span>`}</div>
    </div>`;

    for (let k = 0; k < glbs.length; k++) {
      const partLabel = `Parte ${k+1}`;
      const dots = safeColors.map(c =>
        `<div class="cdot" id="cdot-${p.id}-${partLabel.replace(/\s/g,'_')}-${c.id}"
          style="background:${c.hex}" title="${esc(c.name)}"
          onclick="selectColor('${p.id}','${partLabel}',${k},'${c.hex}','${esc(c.name)}',this,'glb')"></div>`
      ).join('');
      colorSections += `<div class="part-label">Cor — ${partLabel}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">${dots}</div>`;
    }

  /* ─── MODO C: 1 GLB global ─── */
  } else if (glbs.length === 1) {
    imgSection = `<div class="card-img">
      <model-viewer id="mv-${p.id}" src="${esc(glbs[0])}"
        auto-rotate camera-controls shadow-intensity="1"
        style="width:100%;height:100%;display:block;background:var(--mist);--poster-color:transparent">
      </model-viewer>
      <div class="card-badges">${oosTag || '<span class="badge badge-3d">Interativo 3D</span>'}</div>
    </div>`;
    const dots = safeColors.map(c =>
      `<div class="cdot" id="cdot-${p.id}-global-${c.id}"
        style="background:${c.hex}" title="${esc(c.name)}"
        onclick="selectColor('${p.id}','global',-1,'${c.hex}','${esc(c.name)}',this,'all')"></div>`
    ).join('');
    colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots}</div>`;

  /* ─── MODO D: fotos ─── */
  } else if (imgs.length > 0) {
    const dots = imgs.length > 1
      ? `<div class="card-dots">${imgs.map((_,j) => `<div class="card-dot${j===0?' on':''}" onclick="carouselTo(this,${j})"></div>`).join('')}</div>`
      : '';
    imgSection = `<div class="card-img" data-imgs='${JSON.stringify(imgs)}'>
      ${imgs.map((u, j) => `<img src="${u}" alt="${esc(p.name)}" class="${j===0?'on':''}" loading="lazy">`).join('')}
      <div class="card-badges">${oosTag}${!p.oos && p.type==='chaveiro' ? '<span class="badge badge-key">Chaveiro</span>' : ''}</div>
      ${dots}
    </div>`;
    const dots2 = safeColors.map(c =>
      `<div class="cdot" id="cdot-${p.id}-global-${c.id}"
        style="background:${c.hex}" title="${esc(c.name)}"
        onclick="selectColor('${p.id}','global',-1,'${c.hex}','${esc(c.name)}',this,'none')"></div>`
    ).join('');
    colorSections = `<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">${dots2}</div>`;

  /* ─── MODO E: sem imagem ─── */
  } else {
    imgSection = `<div class="card-img">
      <div class="card-img-empty">
        <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Sem Imagem</span>
      </div>
      ${p.oos ? '<div class="card-badges"><span class="badge badge-oos">Esgotado</span></div>' : ''}
    </div>`;
  }

  /* ─── Tamanho / preço ─── */
  const hasSizes = Array.isArray(p.sizes) && p.sizes.length > 0;
  const sizeRow = (hasSizes && p.sizes.length > 1)
    ? `<select class="card-size-sel" id="sel${p.id}" onchange="updPrice('${p.id}')">
        ${p.sizes.map((s,j) => `<option value="${j}" data-price="${s.price||0}">${esc(s.label||'Opção')} — R$ ${fmt(s.price||0)}</option>`).join('')}
       </select>`
    : `<div style="font-size:.75rem;color:var(--stone);margin-bottom:10px;letter-spacing:.02em">${esc(hasSizes ? (p.sizes[0]?.label||'Único') : 'Único')}</div>`;

  const defaultPrice = hasSizes ? (p.sizes[0]?.price || 0) : 0;

  /* ─── Ações do card ─── */
  const actionsRow = p.oos
    ? `<div class="card-actions">
        <div class="card-price-wrap">
          <span class="card-price-label">Valor</span>
          <div class="card-price" id="pr${p.id}"><small>R$</small>${fmt(defaultPrice)}</div>
        </div>
        <span style="font-size:.75rem;color:var(--stone);font-weight:500">Indisponível</span>
      </div>`
    : `<div class="card-actions">
        <div class="card-price-wrap">
          <span class="card-price-label">Valor</span>
          <div class="card-price" id="pr${p.id}"><small>R$</small>${fmt(defaultPrice)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="qty-stepper">
            <button class="qty-btn" onclick="stepQty('${p.id}',-1)">−</button>
            <span class="qty-num" id="qty-${p.id}" data-qty="1">1</span>
            <button class="qty-btn" onclick="stepQty('${p.id}',1)">+</button>
          </div>
          <button onclick="addToCart('${p.id}')" class="btn btn-ember btn-sm">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            Adicionar
          </button>
        </div>
      </div>`;

  return `<div class="card${p.oos?' oos':''}" style="animation:fade .3s ${i*.04}s both">
    ${imgSection}
    <div class="card-body">
      <div class="card-name">${esc(p.name)}</div>
      ${sizeRow}
      ${colorSections}
      ${actionsRow}
    </div>
  </div>`;
}

/* ─── Stepper de qty no card ─── */
function stepQty(prodId, delta) {
  const el = document.getElementById('qty-' + prodId);
  if (!el) return;
  const cur = parseInt(el.dataset.qty) || 1;
  const next = Math.max(1, cur + delta);
  el.dataset.qty = next;
  el.textContent = next;
}

/* ─── Selecionar cor ─── */
/* mode: 'mat' (glbParts material), 'glb' (kit GLBs), 'all' (1 GLB todos mats), 'none' (foto) */
function selectColor(prodId, partLabel, matOrPartIdx, hex, colorName, dotEl, mode) {
  /* Inicializar registro de cores do produto */
  if (!selectedColors[prodId]) selectedColors[prodId] = {};
  selectedColors[prodId][partLabel] = { name: colorName, hex };

  /* Deselect dots do mesmo grupo (mesmo prodId + partLabel) */
  document.querySelectorAll(`[id^="cdot-${prodId}-${partLabel.replace(/\s/g,'_')}-"]`).forEach(d => d.classList.remove('selected'));
  dotEl.classList.add('selected');

  /* Aplicar na visualização 3D */
  if (mode === 'mat') {
    applyMaterialColor(prodId, matOrPartIdx, hex);
  } else if (mode === 'glb') {
    changePartColor(prodId, matOrPartIdx, hex);
  } else if (mode === 'all') {
    changeModelColor(prodId, hex);
  }
}

function updPrice(id) {
  const p = DEF.products.find(x => x.id === id);
  const sel = document.getElementById('sel' + id);
  if (!p || !sel) return;
  document.getElementById('pr' + id).innerHTML = `<small>R$</small>${fmt(p.sizes[+sel.value]?.price || 0)}`;
}

/* ─── Carousel ─── */
function initCarousel(el) {
  const imgs = el.querySelectorAll('img');
  if (imgs.length < 2) return;
  let cur = 0;
  const dots = el.querySelectorAll('.card-dot');
  setInterval(() => {
    imgs[cur].classList.remove('on'); dots[cur]?.classList.remove('on');
    cur = (cur + 1) % imgs.length;
    imgs[cur].classList.add('on'); dots[cur]?.classList.add('on');
  }, 3200);
}
function carouselTo(dot, idx) {
  const c = dot.closest('.card-img');
  c.querySelectorAll('img').forEach((img, i) => img.classList.toggle('on', i === idx));
  c.querySelectorAll('.card-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
}

/* ─── WhatsApp contato geral ─── */
function goWaTop() {
  const texto = encodeURIComponent('Olá! Visitei a loja Forma 3D e gostaria de informações.');
  window.open(`https://wa.me/${DEF.waNumber}?text=${texto}`, '_blank');
}

/* ══════════════════════════════════════════════════════════
   FUNÇÕES DE COR EM MODELOS 3D
══════════════════════════════════════════════════════════ */
function applyMaterialColor(prodId, materialIndex, hex) {
  const mv = document.getElementById('mv-' + prodId);
  if (!mv) return;
  const [r, g, b] = hexToRgb(hex);
  const apply = () => {
    const mats = mv.model && mv.model.materials;
    if (mats && mats[materialIndex]) {
      mats[materialIndex].pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
    }
  };
  if (mv.model) apply();
  else mv.addEventListener('load', apply, { once: true });
}

function changeModelColor(prodId, hex) {
  const mv = document.getElementById('mv-' + prodId);
  if (!mv) return;
  const [r, g, b] = hexToRgb(hex);
  const apply = () => {
    if (mv.model && mv.model.materials) {
      mv.model.materials.forEach(mat => {
        mat.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
      });
    }
  };
  if (mv.model) apply();
  else mv.addEventListener('load', apply, { once: true });
}

function changePartColor(prodId, partIdx, hex) {
  const mv = document.getElementById(`mv-${prodId}-${partIdx}`);
  if (!mv) return;
  const [r, g, b] = hexToRgb(hex);
  const apply = () => {
    if (mv.model && mv.model.materials) {
      mv.model.materials.forEach(mat => {
        mat.pbrMetallicRoughness.setBaseColorFactor([r, g, b, 1]);
      });
    }
  };
  if (mv.model) apply();
  else mv.addEventListener('load', apply, { once: true });
}

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3), 16) / 255,
    parseInt(hex.slice(3,5), 16) / 255,
    parseInt(hex.slice(5,7), 16) / 255,
  ];
}

/* ─── Utilitários ─── */
function fmt(n) { return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer;
function toast(msg) {
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 't';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

/* ─── Boot ─── */
renderShop();
